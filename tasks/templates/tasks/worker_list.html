<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workers</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'task-list' %}">
            Task Manager
        </a>

        <div>
            <a class="btn btn-outline-light" href="{% url 'worker-list' %}">
                Workers
            </a>

            <a class="btn btn-primary" href="{% url 'task-create' %}">
                Create task
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <h1 class="mb-4">Workers</h1>

    {% for worker in workers %}

        <div class="card mb-3">
            <div class="card-body">

                <h2 class="card-title">
                    <a
                        class="text-decoration-none"
                        href="{% url 'worker-detail' worker.pk %}"
                    >
                        {{ worker.username }}
                    </a>
                </h2>

                <p>
                    <strong>First name:</strong>
                    {{ worker.first_name }}
                </p>

                <p>
                    <strong>Last name:</strong>
                    {{ worker.last_name }}
                </p>

                <p>
                    <strong>Email:</strong>
                    {{ worker.email }}
                </p>

                <p>
                    <strong>Position:</strong>
                    {{ worker.position }}
                </p>

            </div>
        </div>

    {% empty %}

        <p>No workers available.</p>

    {% endfor %}

</div>

</body>
</html>
