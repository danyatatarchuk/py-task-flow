<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Task</title>
</head>
<body>
    <h1>Delete Task</h1>

    <p>Are you sure you want to delete "{{ task.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete Task</button>
    </form>

    <a href="{% url 'task-detail' task.pk %}">Cancel</a>
</body>
</html>
