<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete task</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'task-list' %}">
            Task Manager
        </a>

        <div>
            <a class="btn btn-outline-light" href="{% url 'worker-list' %}">
                Workers
            </a>

            <a class="btn btn-primary" href="{% url 'task-create' %}">
                Create task
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <h1 class="mb-4">Delete task</h1>

    <div class="card">
        <div class="card-body">

            <p>
                Are you sure you want to delete
                <strong>{{ object.name }}</strong>?
            </p>

            <form method="post">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Delete task
                </button>

                <a
                    class="btn btn-secondary"
                    href="{% url 'task-detail' object.pk %}"
                >
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
